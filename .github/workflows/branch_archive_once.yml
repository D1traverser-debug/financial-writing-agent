name: Financial one-time archive of obsolete branches

on:
  workflow_dispatch:
    inputs:
      start_archive:
        description: "Create a read-only manifest, then wait for two separately approved phases."
        required: true
        type: boolean
        default: false
      confirm_unverified_branch_archive:
        description: "After inspecting the manifest, explicitly authorize pruning archived non-main refs without an exact merged-to-main PR head."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: financial-branch-archive
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' && inputs.start_archive == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.plan.outputs.manifest_sha256 }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Build stable read-only branch manifest
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.FINANCIAL_ARCHIVE_READ_TOKEN }}
        run: python scripts/branch_archive_cleanup.py --plan --out audit/financial_branch_plan.json
      - name: Upload exact manifest for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-branch-plan-${{ github.sha }}
          path: audit/financial_branch_plan.json
          if-no-files-found: error
          retention-days: 90

  archive:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: financial-branch-archive
    steps:
      - name: Checkout exact planned main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Download reviewed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: financial-branch-plan-${{ github.sha }}
          path: audit
      - name: Mint short-lived, single-repository archive token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.FINANCIAL_ARCHIVE_APP_ID }}
          private-key: ${{ secrets.FINANCIAL_ARCHIVE_APP_PRIVATE_KEY }}
          owner: D1traverser-debug
          repositories: financial-writing-agent
          permission-administration: write
          permission-contents: write
          permission-pull-requests: read
          permission-environments: read
      - name: Create and verify all archive tags; do not delete branches
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          python scripts/branch_archive_cleanup.py --archive-only
          --manifest audit/financial_branch_plan.json
          --approved-manifest-sha256 ${{ needs.plan.outputs.manifest_sha256 }}
          --out audit/financial_branch_archive.json
      - name: Preserve archive-phase readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-branch-archive-readback-${{ github.sha }}
          path: audit/financial_branch_archive.json
          if-no-files-found: warn
          retention-days: 90

  prune:
    needs: [plan, archive]
    if: ${{ needs.plan.result == 'success' && needs.archive.result == 'success' && inputs.confirm_unverified_branch_archive == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: financial-branch-prune
    steps:
      - name: Checkout exact planned main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Download the same reviewed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: financial-branch-plan-${{ github.sha }}
          path: audit
      - name: Mint short-lived, single-repository prune token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.FINANCIAL_ARCHIVE_APP_ID }}
          private-key: ${{ secrets.FINANCIAL_ARCHIVE_APP_PRIVATE_KEY }}
          owner: D1traverser-debug
          repositories: financial-writing-agent
          permission-administration: write
          permission-contents: write
          permission-pull-requests: read
          permission-environments: read
      - name: Prune only after separate reviewer approval and deletion-rule removal
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          python scripts/branch_archive_cleanup.py --prune-only
          --manifest audit/financial_branch_plan.json
          --approved-manifest-sha256 ${{ needs.plan.outputs.manifest_sha256 }}
          --confirm-unverified-branch-archive
          --out audit/financial_branch_prune.json
      - name: Preserve final full inventory and tag readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-branch-prune-readback-${{ github.sha }}
          path: audit/financial_branch_prune.json
          if-no-files-found: warn
          retention-days: 90
