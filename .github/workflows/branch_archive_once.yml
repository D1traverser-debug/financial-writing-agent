name: Financial one-time archive of obsolete branches

on:
  workflow_dispatch:
    inputs:
      confirm_archive_prune:
        description: "Request tag-first archive and prune. A required GitHub Environment reviewer must approve the run."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: financial-branch-archive
  cancel-in-progress: false

jobs:
  one-time-archive:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_archive_prune == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: financial-branch-archive
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Dry-run full branch and PR inventory
        env:
          GITHUB_TOKEN: ${{ secrets.FINANCIAL_ARCHIVE_TOKEN }}
        run: python scripts/branch_archive_cleanup.py --out audit/financial_branches_dry_run.json

      - name: Archive exact branch heads, verify every tag, then prune
        env:
          GITHUB_TOKEN: ${{ secrets.FINANCIAL_ARCHIVE_TOKEN }}
          FINANCIAL_REVIEWED_MAIN_SHA: ${{ github.sha }}
        run: python scripts/branch_archive_cleanup.py --apply --out audit/financial_branch_archive.json

      - name: Upload inventory and post-mutation readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-archived-branch-ref-map-${{ github.sha }}
          path: audit/financial_branch*.json
          if-no-files-found: warn
          retention-days: 90
