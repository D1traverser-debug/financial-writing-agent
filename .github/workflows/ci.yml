name: financial-writing-agent-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,openai]'
      - name: OpenAI Agents SDK surface smoke
        run: python scripts/sdk_smoke.py
      - name: MCP Streamable HTTP smoke
        run: python scripts/mcp_smoke.py
      - name: Unit and trajectory tests
        run: pytest -q
      - name: Executable contract eval baseline
        run: python scripts/eval_contracts.py
      - name: Static rule ownership and bundle audit
        run: python scripts/static_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Recover malformed Site lockfile for this repair branch
        working-directory: deploy/chatgpt-site/site
        run: |
          if node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))" 2>/dev/null; then
            echo 'Existing package-lock.json is valid UTF-8 JSON.'
          else
            echo 'Existing package-lock.json is malformed; regenerating from package.json for repository repair.'
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts
          fi
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log('Recovered package-lock.json parses as UTF-8 JSON')"
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-site-package-lock
          path: deploy/chatgpt-site/site/package-lock.json
          if-no-files-found: error
      - name: Site Runtime TypeScript contract tests
        working-directory: deploy/chatgpt-site/site
        run: |
          npm ci
          npm test
      - name: Build wheel and isolated install smoke
        run: |
          python -m build --wheel
          python -m venv /tmp/fwa-wheel
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -1)
          /tmp/fwa-wheel/bin/pip install "$WHEEL"
          mkdir -p /tmp/fwa-wheel-data
          cd /tmp
          FINANCIAL_WRITING_DATA_DIR=/tmp/fwa-wheel-data /tmp/fwa-wheel/bin/python - <<'PY'
          from financial_writing_agent.resources import load_packaged_policy, read_reference
          from financial_writing_agent.adapters.deterministic import DeliveryExecutor
          import financial_writing_agent.plugin_server as server

          policy = load_packaged_policy()
          assert policy["defaults"]["distribution_mode"] == "DUAL"
          assert "Research" in read_reference("research.md") or "research" in read_reference("research.md").lower()
          DeliveryExecutor(root="/tmp/fwa-wheel-runs")
          assert server.mcp is not None
          print("PASS: clean wheel install contains policy/references and imports typed public MCP outside repo")
          PY
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: DOCX render smoke
        run: python scripts/render_smoke.py
