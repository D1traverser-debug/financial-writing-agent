name: financial-writing-agent-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,openai]'
      - name: OpenAI Agents SDK surface smoke
        run: python scripts/sdk_smoke.py
      - name: Unit and trajectory tests
        run: pytest -q
      - name: Executable contract eval baseline
        run: python scripts/eval_contracts.py
      - name: Static rule ownership audit
        run: python scripts/static_audit.py
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: DOCX render smoke
        run: python scripts/render_smoke.py
