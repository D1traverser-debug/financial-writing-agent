name: financial-writing-agent-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and trajectory tests
        run: pytest -q
      - name: Executable contract eval baseline
        run: python scripts/eval_contracts.py
      - name: Static single-owner and legacy-quarantine audit
        run: python scripts/static_audit.py
      - name: Build wheel and isolated install smoke
        run: |
          python -m build --wheel
          python -m venv /tmp/fwa-wheel
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -1)
          /tmp/fwa-wheel/bin/pip install "$WHEEL"
          mkdir -p /tmp/fwa-wheel-data
          cd /tmp
          FINANCIAL_WRITING_DATA_DIR=/tmp/fwa-wheel-data /tmp/fwa-wheel/bin/python - <<'PY'
          from financial_writing_agent.models import DistributionMode, TaskContract
          from financial_writing_agent.resources import load_packaged_policy, read_reference
          from financial_writing_agent.adapters.deterministic import DeliveryExecutor
          from financial_writing_agent.owner_guard import build_initial_state
          from financial_writing_agent.owner_lifecycle import resume_blocked_state

          policy = load_packaged_policy()
          assert policy["defaults"]["distribution_mode"] == "DUAL"
          assert TaskContract(prompt="smoke").distribution_mode == DistributionMode.DUAL
          assert "Research" in read_reference("research.md") or "research" in read_reference("research.md").lower()
          DeliveryExecutor(root="/tmp/fwa-wheel-runs")
          assert callable(build_initial_state)
          assert callable(resume_blocked_state)
          print("PASS: clean wheel contains canonical policy/references, TaskContract, owner guard/lifecycle and deterministic delivery")
          PY
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: DOCX render smoke
        run: python scripts/render_smoke.py
