name: financial-writing-agent-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financial-writing-agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and trajectory tests
        run: pytest -q
      - name: Executable contract eval baseline
        run: python scripts/eval_contracts.py
      - name: Static single-owner and legacy-quarantine audit
        run: python scripts/static_audit.py
      - name: Static retired-runtime absence audit
        run: python scripts/retired_runtime_static_audit.py
      - name: Build wheel and isolated install smoke
        run: |
          python -m build --wheel
          python -m venv /tmp/fwa-wheel
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -1)
          /tmp/fwa-wheel/bin/pip install "$WHEEL"
          cd /tmp
          /tmp/fwa-wheel/bin/python - <<'PY'
          import importlib.util
          from financial_writing_agent.models import DistributionMode, TaskContract
          from financial_writing_agent.resources import load_packaged_policy, read_reference
          from financial_writing_agent.document import build_article_docx, build_audit_docx
          from financial_writing_agent.checks import check_docx
          from financial_writing_agent.owner_guard import build_initial_state
          from financial_writing_agent.owner_lifecycle import resume_blocked_state

          policy = load_packaged_policy()
          first = TaskContract(prompt="smoke-one")
          second = TaskContract(prompt="smoke-two")
          assert policy["defaults"]["distribution_mode"] == "DUAL"
          assert first.distribution_mode == DistributionMode.DUAL
          assert first.task_id and second.task_id and first.task_id != second.task_id
          assert importlib.util.find_spec("financial_writing_agent.uaos_binding") is None
          assert "Research" in read_reference("research.md") or "research" in read_reference("research.md").lower()
          assert callable(build_article_docx) and callable(build_audit_docx) and callable(check_docx)
          assert callable(build_initial_state) and callable(resume_blocked_state)
          print("PASS: clean wheel contains domain-owned Financial task identity, canonical policy/references, owner lifecycle and stateless Word utilities")
          PY
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: DOCX render smoke
        run: python scripts/render_smoke.py
