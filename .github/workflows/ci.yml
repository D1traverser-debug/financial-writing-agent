name: financial-writing-agent-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financial-writing-agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and trajectory tests
        run: pytest -q
      - name: Executable contract eval baseline
        run: python scripts/eval_contracts.py
      - name: Static single-owner and legacy-quarantine audit
        run: python scripts/static_audit.py
      - name: Static retired-runtime absence audit
        run: python scripts/retired_runtime_static_audit.py
      - name: Build wheel and isolated install smoke
        run: |
          python -m build --wheel
          python -m venv /tmp/fwa-wheel
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -1)
          /tmp/fwa-wheel/bin/pip install "$WHEEL"
          cd /tmp
          /tmp/fwa-wheel/bin/python - <<'PY'
          import importlib.metadata
          import importlib.util
          from financial_writing_agent.models import ArtifactKind, DistributionMode, TaskContract
          from financial_writing_agent.resources import load_packaged_policy, read_reference
          from financial_writing_agent.document import build_article_docx, build_audit_docx, build_interaction_pack_docx
          from financial_writing_agent.checks import check_docx
          from financial_writing_agent.current_admission import WRITING_KERNEL_VERSION, build_initial_state
          from financial_writing_agent.owner_lifecycle import resume_blocked_state
          from financial_writing_agent.resume_compatibility import require_material_resume_admission
          from financial_writing_agent.story_quality import CausalTransmission, ValueChainScopeDecision

          policy = load_packaged_policy()
          contract = TaskContract(prompt="smoke")
          state = build_initial_state(
              task_id="financial-wheel-smoke",
              prompt="smoke",
              source_refs=[],
              executor_identity="wheel-smoke",
          )
          assert importlib.metadata.version("financial-writing-agent") == "1.0.2"
          assert WRITING_KERNEL_VERSION == "1.0"
          assert policy["contract_version"] == "0.9.1"
          assert policy["defaults"]["distribution_mode"] == "PORTFOLIO"
          assert policy["style"]["voice_material_first_generation_required"] is True
          assert policy["style"]["template_cluster_signals_are_diagnostic_not_generation_mandates"] is True
          assert policy["style"]["voice_evidence_priority"][0] == "USER_APPROVED_OR_EDITED_SAMPLES"
          assert contract.distribution_mode == DistributionMode.PORTFOLIO
          assert contract.required_outputs == [
              ArtifactKind.AUDIT_DOCX,
              ArtifactKind.FINANCE_DEEP_DOCX,
              ArtifactKind.FINANCE_BROAD_DOCX,
              ArtifactKind.PLATFORM_INTERACTION_PACK_DOCX,
          ]
          assert not hasattr(contract, "task_id")
          assert state["task_id"] == "financial-wheel-smoke"
          assert state["writing_kernel_version"] == "1.0"
          assert state["quality_evidence"] == {}
          assert state["execution_receipts"][0]["task_id"] == "financial-wheel-smoke"
          assert state["distribution_mode"] == "PORTFOLIO"
          assert importlib.util.find_spec("financial_writing_agent.uaos_binding") is None
          assert "Research" in read_reference("research.md") or "research" in read_reference("research.md").lower()
          reader_value = read_reference("reader_value.md")
          assert "Company Decision Map" in reader_value
          assert "voice/material first" in reader_value
          assert "not generation mandates" in reader_value
          assert callable(build_article_docx) and callable(build_audit_docx) and callable(build_interaction_pack_docx) and callable(check_docx)
          assert callable(build_initial_state) and callable(resume_blocked_state) and callable(require_material_resume_admission)
          assert CausalTransmission and ValueChainScopeDecision
          print("PASS: clean Financial Writing 1.0.2 wheel exposes current admission, historical-resume compatibility, selective Deep publication architecture, event-company causal grounding, kernel 1.0, PORTFOLIO outputs, and single Financial identity path")
          PY
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: DOCX render smoke
        run: python scripts/render_smoke.py
