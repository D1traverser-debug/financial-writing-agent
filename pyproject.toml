[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "1.1.0"
description = "Standalone Chinese financial research and publishing system with Financial-owned user-goal recovery, source and company research, evidence-bound decision loop, Deep/Broad stories, task-scoped requirements, original prose, Word delivery, independently checkable evidence and direct authorized Git state operations."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "coverage>=7.6"]

# The primary deployment is the directly selected standalone Financial Skill.
# The optional provider-neutral action adapter exposes authorized state operations,
# but is not a deployed app server or an external parent-dependent runtime.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
