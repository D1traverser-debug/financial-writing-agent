[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.8.3"
description = "A-share financial-writing owner with domain-owned article identity and state, material-complete finance analysis, explicit-scope market explanation, durable article checkpoints, evidence-bounded review, system-impact escalation, Reader Funnel and Writing DNA controls, and auditable Word delivery under optional UAOS-hosted governance."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

# No production console/MCP entrypoint is exported. The supported hosted path is
# ChatGPT -> UAOS routing -> GitHub main Financial owner. UAOS integration metadata
# does not own Financial article identity, workflow state or business rules.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
