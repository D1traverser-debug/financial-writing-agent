[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.8.1"
description = "A-share financial-writing owner for the single ChatGPT + GitHub main trajectory, with material-complete finance analysis, explicit-scope market explanation, durable article checkpoints, evidence-bounded review, system-impact escalation, Reader Funnel and Writing DNA controls, and auditable Word delivery."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.4"]
dev = ["pytest>=8", "build>=1.2"]

# No production console/MCP entrypoint is exported. The user's supported product
# path is ChatGPT -> GitHub main Financial owner. Legacy local/plugin modules may
# remain temporarily for migration/history but are not package-level task authorities.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]