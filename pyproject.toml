[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.8.2"
description = "A-share financial-writing owner for the single UAOS + GitHub main trajectory, with material-complete finance analysis, explicit-scope market explanation, durable article checkpoints, evidence-bounded review, system-impact escalation, Reader Funnel and Writing DNA controls, auditable Word delivery, and explicit UAOS article-task binding validation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

# No production console/MCP entrypoint is exported. The user's supported product
# path is ChatGPT -> UAOS -> GitHub main Financial owner. Retired local/plugin modules
# are not part of the supported execution surface and carry no install-time dependency.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
