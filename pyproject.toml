[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.2.0"
description = "Deterministic financial-writing agent runtime with skill-based reasoning and auditable delivery."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.4"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
financial-write = "financial_writing_agent.cli:main"
financial-writing-mcp = "financial_writing_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
