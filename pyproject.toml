[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "1.0.3"
description = "A-share financial-writing owner with direct Financial-domain activation, UAOS-hosted common governance, mandatory digest-bound private research before publication planning, post-evolution resume compatibility, value-chain-first research, evidence-bound DecisionEnvelope cognition, selective StoryBlueprint publication architecture, event-to-company causal grounding, publication-fitness admission, durable topic/method knowledge, historical provenance compatibility, and auditable Word delivery."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

# No production console/MCP entrypoint is exported. The supported hosted path is
# a directly selected Financial work plane with UAOS-hosted common governance.
# UAOS integration metadata does not own Financial article identity, workflow state,
# product requirements or business rules.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
