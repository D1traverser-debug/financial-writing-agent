[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.9.1"
description = "A-share financial-writing owner with direct domain activation, domain-owned article identity/state, UAOS-hosted cognition and governed evolution, voice-first authorial writing, evidence-bounded company decision utility, reader-value publishing controls, three-product platform delivery, durable recovery, and auditable Word output."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

# No production console/MCP entrypoint is exported. The supported hosted path is
# a directly selected Financial work plane with UAOS-hosted common governance.
# UAOS integration metadata does not own Financial article identity, workflow state,
# product requirements or business rules.

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.setuptools.package-data]
financial_writing_agent = [
  "resources/policy.json",
  "resources/references/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
