[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-writing-agent"
version = "0.2.0"
description = "Deterministic financial-writing agent runtime with skill-based reasoning and auditable delivery."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
financial-write = "financial_writing_agent.cli:main"

[tool.setuptools.packages.find]
include = ["financial_writing_agent*"]
exclude = ["tests*", "evals*", "config*", "references*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
